<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--HEAD-->
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="/static/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/styles.css">
<script type="module" src="/static/app.js"></script>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<header class="top">
  <a class="brand" href="/" aria-label="Custom Tube home">
    <svg class="brand-logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="3.5" width="13" height="9.5" rx="2.25" fill="none" stroke="currentColor" stroke-opacity=".4" stroke-width="1.5"/><rect x="3" y="8.5" width="14" height="11" rx="2.5" class="brand-front"/></svg>
    <span class="brand-word">custom<span>tube</span></span>
  </a>
  <nav class="tabs" aria-label="Sections">
    <a href="/" data-nav="/"><i data-icon="home"></i><span>Home</span></a>
    <a href="/shorts" data-nav="/shorts"><i data-icon="shorts"></i><span>Shorts</span></a>
    <a href="/channels" data-nav="/channels"><i data-icon="channels"></i><span>Channels</span></a>
    <a href="/topics" data-nav="/topics"><i data-icon="topics"></i><span>Topics</span></a>
    <a href="/library" data-nav="/library"><i data-icon="library"></i><span>Library</span></a>
    <a href="/settings" data-nav="/settings" class="tab-tune"><i data-icon="sliders"></i><span>Customize</span></a>
  </nav>
  <div class="top-end">
    <form id="search" class="search" role="search">
      <i data-icon="search" class="search-icon"></i>
      <input id="q" name="q" type="search" placeholder="Search" autocomplete="off" maxlength="200" aria-label="Search videos">
      <button type="button" id="palette-open" class="kbd-hint" aria-label="Quick search (Ctrl K)"><kbd>⌘K</kbd></button>
      <button type="submit" class="visually-hidden">Search</button>
    </form>
    <button id="you" class="icon-btn" type="button" popovertarget="side-extra" aria-label="Your channels, topics and lists"><i data-icon="you"></i></button>
    <button id="theme" class="icon-btn" type="button" aria-label="Dark theme" aria-pressed="true"><i data-icon="sun"></i></button>
  </div>
</header>
<div class="side-extra" id="side-extra" popover></div>
<main id="view" tabindex="-1"><p class="status">Loading…</p></main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="help" class="modal" aria-labelledby="help-title"></dialog>
<dialog id="dialog" class="modal" aria-labelledby="dialog-title"></dialog>
<dialog id="palette" class="modal palette" aria-label="Quick search"></dialog>
<footer class="foot"><span class="foot-mark">customtube</span><a href="/about">About</a><a href="/history">History</a><span class="keys-hint">Press <kbd>?</kbd> for shortcuts</span></footer>
<noscript><p class="status">Custom Tube needs JavaScript to run.</p></noscript>
</body>
</html>
